name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx jest --ci

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tappay
          POSTGRES_PASSWORD: tappay
          POSTGRES_DB: tappay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tappay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tappay:tappay@localhost:5432/tappay_test
      SESSION_SIGNING_SECRET: ci-integration-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Create schema
        run: npx prisma db push
      - name: Integration tests (real Postgres)
        run: npm run test:int
